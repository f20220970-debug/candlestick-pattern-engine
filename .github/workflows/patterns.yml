name: Candlestick patterns

on:
  schedule:
    - cron: "0 7 * * 1"      # 07:00 UTC every Monday (weekly refresh with the latest prices)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install packages
        run: pip install -r requirements.txt
      - name: Test pattern rules
        run: pytest -q
      - name: Download prices, detect patterns, measure forward returns
        run: python run.py
      - name: Commit refreshed outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs reports
          git diff --cached --quiet || git commit -m "Pattern run $(date -u +'%Y-%m-%d')"
          git push
